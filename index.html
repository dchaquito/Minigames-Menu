<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magical Party | Minijuegos</title><link rel="stylesheet" href="styles.css"></head><body><div class="sparkles" aria-hidden="true"></div><main class="app"><header><div class="eyebrow">✦ MAGICAL PARTY ✦</div><h1>MINIJUEGOS</h1><p id="subtitle">Elige una categoría para comenzar</p></header><section id="menu" class="menu" aria-label="Categorías"><button class="category blue" data-cat="all"><span class="symbol">✦</span><strong>Todos contra todos</strong><small>8 equipos · 3 minijuegos</small></button><button class="category green" data-cat="duo"><span class="symbol">⚔</span><strong>Dos contra dos</strong><small>2 vs. 2 · 3 minijuegos</small></button><button class="category yellow" data-cat="solo"><span class="symbol">♛</span><strong>Todos contra uno</strong><small>7 vs. 1 · 3 minijuegos</small></button><button class="category red" data-cat="challenge"><span class="symbol">⚡</span><strong>Desafío</strong><small>3 minijuegos especiales</small></button></section><section id="game" class="game hidden" aria-label="Ruleta"><div class="topbar"><button id="back" class="back">← Volver a categorías</button><span id="categoryLabel" class="categoryLabel"></span></div><div class="wheel-wrap"><div class="pointer" aria-hidden="true">▼</div><div id="wheel" class="wheel" aria-label="Ruleta de minijuegos"><div id="wheelLabels" class="wheel-labels"></div><div class="wheel-center">★</div></div></div><div id="status" class="status" aria-live="polite">¡Gira para descubrir el minijuego!</div><button id="spin" class="spin">GIRAR RULETA ✦</button><div id="result" class="result hidden" aria-live="polite"><div class="result-tag">✦ MINIJUEGO SELECCIONADO ✦</div><h2 id="resultName"></h2><p id="resultDescription"></p></div><div class="progress" id="progress"></div></section><footer>Los minijuegos descubiertos se guardan automáticamente en este navegador.</footer></main><script src="app.js"></script></body></html>
